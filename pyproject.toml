[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipelens"
version = "0.1.0"
description = "A conversational recipe search foundation"
requires-python = ">=3.11,<3.12"
dependencies = ["ijson>=3.2", "PyYAML>=6", "tqdm>=4.66", "numpy>=1.25", "sentence-transformers>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
faiss = ["faiss-cpu>=1.8"]
eval = ["google-genai>=1.0"]

[tool.setuptools.packages.find]
include = ["recipelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: uses the complete Recipe Box database or persisted retrieval index"]

[tool.ruff]
line-length = 100
target-version = "py311"
