# Owner-approved product boundaries, reviewed 2026-11-11.
# Match the ingredient head (text before preparation comma), not arbitrary mentions in notes.
families:
  tomato:
    match_patterns:
      - "\\btomato(?:es)?\\s*$"
    exclude_patterns:
      - "\\btomatillos?\\b"
      - "\\btomato(?:es)?\\s+(?:paste|sauce|juice|puree|purée|powder|ketchup|soup)\\b"
  garlic:
    match_patterns:
      - "\\bgarlic(?:\\s+cloves?)?\\s*$"
    exclude_patterns:
      - "\\b(?:garlic|granulated garlic|dried garlic) (?:powder|salt|paste|sauce)\\b"
      - "\\b(?:chili|chile|chilli)[ -]garlic sauce\\b"
  onion:
    match_patterns:
      - "\\bonions?\\s*$"
    exclude_patterns:
      - "\\bgreen onions?\\b"
      - "\\b(?:scallions?|spring onions?)\\b"
      - "\\b(?:onion|granulated onion|dried onion) (?:powder|salt|flakes)\\b"
      - "\\b(?:dry|dried) onion soup mix\\b"
      - "\\bonion soup mix\\b"
  green onion:
    match_patterns:
      - "\\b(?:green onions?|scallions?|spring onions?)\\s*$"
    exclude_patterns:
      - "\\b(?:green onion|scallion|spring onion) (?:powder|salt|flakes|dip)\\b"
  tomato sauce:
    match_patterns:
      - "\\btomato(?:es)?\\s+sauce\\b"
    exclude_patterns: []
  tomato paste:
    match_patterns:
      - "\\btomato(?:es)?\\s+paste\\b"
    exclude_patterns: []
  garlic powder:
    match_patterns:
      - "\\b(?:garlic|granulated garlic|dried garlic)\\s+powder\\b"
    exclude_patterns: []
  onion powder:
    match_patterns:
      - "\\b(?:onion|granulated onion|dried onion)\\s+powder\\b"
    exclude_patterns: []
